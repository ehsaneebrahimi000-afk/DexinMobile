name: Dexin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check uploaded parts
        shell: bash
        run: |
          ls -la *.zip
          for f in part1.zip part2.zip fixed_part3.zip fixed_part4.zip; do
            test -f "$f" || { echo "::error::MISSING FILE $f - upload it to the repo root"; exit 1; }
          done
          echo "all 4 parts found"

      - name: Unpack parts
        shell: bash
        run: |
          set -e
          mkdir -p work
          for z in part1.zip part2.zip fixed_part3.zip fixed_part4.zip; do
            echo "unpacking $z"
            unzip -oq "$z" -d work || [ $? -eq 1 ]
          done
          cd work/samp-android-launcher-32-64bit-main
          find . -name '*.__chunk000' -print0 | while IFS= read -r -d '' first; do
            base="${first%.__chunk000}"
            echo "joining $base"
            cat "$base".__chunk* > "$base"
            rm -f "$base".__chunk*
          done
          bad=0
          required="app/build.gradle
          build.gradle
          settings.gradle
          app/google-services.json
          app/src/main/AndroidManifest.xml
          app/src/main/jniLibs/arm64-v8a/libGTASA.so
          app/src/main/jniLibs/arm64-v8a/libOpenAL64.so
          app/src/main/jniLibs/arm64-v8a/libSCAnd.so
          app/src/main/jniLibs/armeabi-v7a/libGTASA.so
          app/src/main/jniLibs/armeabi-v7a/libOpenAL32.so
          app/src/main/jniLibs/armeabi-v7a/libSCAnd.so
          app/src/main/jniLibs/armeabi-v7a/libImmEmulatorJ.so
          app/src/main/cpp/CMakeLists.txt
          app/src/main/cpp/multiplayer/CMakeLists.txt"
          for f in $required; do
            test -s "$f" || { echo "::error::missing after unpack: $f"; bad=1; }
          done
          count=$(find . -type f | wc -l)
          echo "files after unpack: $count (expected 1969)"
          test "$count" -ge 1960 || { echo "::error::too few files"; bad=1; }
          grep -q "Legendary Samp" app/src/main/java/com/glory/Config.java || { echo "::error::old Config.java"; bad=1; }
          grep -q "UntagPtr" app/src/main/cpp/multiplayer/game/hooks.cpp || { echo "::error::old hooks.cpp"; bad=1; }
          grep -q "playertablist.h" app/src/main/cpp/multiplayer/gui/gui.h || { echo "::error::old gui.h"; bad=1; }
          test "$bad" -eq 0 || { echo "Project is incomplete or old - re-upload fixed_part3.zip and fixed_part4.zip"; exit 1; }
          echo "Project unpacked OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > work/samp-android-launcher-32-64bit-main/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create signing key
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias temp -keyalg RSA -keysize 2048 -validity 10000 -storepass tempPass123 -keypass tempPass123 -dname "CN=Dexin Mobile"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=tempPass123" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=temp" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=tempPass123" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        working-directory: work/samp-android-launcher-32-64bit-main
        run: gradle assembleVer_releaseRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dexin-APK
          path: work/samp-android-launcher-32-64bit-main/app/build/outputs/apk/**/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
