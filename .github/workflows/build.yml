name: Build Dexin Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Dexin Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==================================================
      # 2. Check 5 ZIP parts
      # ==================================================
      - name: Verify ZIP parts
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Checking ZIP parts"
          echo "=========================================="

          missing=0

          for file in \
            part1.zip \
            part2.zip \
            part3.zip \
            part4.zip \
            part5.zip
          do
            if [ ! -f "$file" ]; then
              echo "::error::Missing ZIP: $file"
              missing=1
            else
              size=$(stat -c%s "$file")
              sha=$(sha256sum "$file" | awk '{print $1}')

              echo "FOUND: $file"
              echo "SIZE : $size bytes"
              echo "SHA  : $sha"
              echo
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Upload part1.zip through part5.zip to repository root."
            exit 1
          fi

          echo "All ZIP parts are present."


      # ==================================================
      # 3. Prepare workspace
      # ==================================================
      - name: Prepare workspace
        shell: bash
        run: |
          set -e

          rm -rf work
          mkdir -p work

          echo "Workspace ready."


      # ==================================================
      # 4. Extract all 5 parts
      # ==================================================
      - name: Extract ZIP parts
        shell: bash
        run: |
          set -e

          for zip in \
            part1.zip \
            part2.zip \
            part3.zip \
            part4.zip \
            part5.zip
          do
            echo
            echo "=========================================="
            echo "Extracting $zip"
            echo "=========================================="

            unzip -oq "$zip" -d work
          done

          echo
          echo "All parts extracted."


      # ==================================================
      # 5. Join Claude chunk files
      # ==================================================
      - name: Join split files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for split chunks"
          echo "=========================================="

          chunk_count=$(find work \
            -type f \
            -name '*.__chunk000' \
            | wc -l)

          echo "Chunk groups found: $chunk_count"

          find work \
            -type f \
            -name '*.__chunk000' \
            -print0 |
          while IFS= read -r -d '' first
          do
            base="${first%.__chunk000}"

            echo
            echo "Joining:"
            echo "$base"

            cat "$base".__chunk* > "$base"

            rm -f "$base".__chunk*

            echo "Joined successfully."
          done

          echo
          echo "Chunk joining finished."


      # ==================================================
      # 6. Locate Android project automatically
      # ==================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for Android project"
          echo "=========================================="

          PROJECT_DIR=""

          # First: search for app/build.gradle
          BUILD_FILE=$(find work \
            -type f \
            -path '*/app/build.gradle' \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find work \
              -type f \
              -path '*/app/build.gradle.kts' \
              | head -n 1)
          fi

          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$(dirname "$BUILD_FILE")")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find Android app/build.gradle."
            echo
            echo "Files found inside work:"
            find work -maxdepth 6 -type f | head -n 300
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 7. Show native libraries
      # ==================================================
      - name: Locate native libraries
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for native libraries"
          echo "=========================================="

          echo
          echo "libGTASA.so:"
          find "$PROJECT_DIR" \
            -type f \
            -name "libGTASA.so" \
            -print || true

          echo
          echo "libOpenAL:"
          find "$PROJECT_DIR" \
            -type f \
            -iname "libOpenAL*.so" \
            -print || true

          echo
          echo "libSCAnd.so:"
          find "$PROJECT_DIR" \
            -type f \
            -name "libSCAnd.so" \
            -print || true

          echo
          echo "All .so files:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.so" \
            -print || true


      # ==================================================
      # 8. Verify Android project
      # ==================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Verifying Android project"
          echo "=========================================="

          missing=0

          check_file() {
            if [ ! -s "$1" ]; then
              echo "::error::Missing file: $1"
              missing=1
            else
              echo "OK: $1"
            fi
          }

          echo
          echo "Project files:"
          echo "------------------------------------------"

          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "OK: settings.gradle"
          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "OK: settings.gradle.kts"
          else
            echo "::error::settings.gradle not found"
            missing=1
          fi

          if [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "OK: build.gradle"
          elif [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "OK: build.gradle.kts"
          else
            echo "::error::root build.gradle not found"
            missing=1
          fi

          check_file "$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            check_file "$PROJECT_DIR/app/build.gradle.kts"
          fi

          check_file "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt" ]; then
            echo "OK: CMakeLists.txt"
          else
            echo "::warning::CMakeLists.txt not found"
          fi


          # ==================================================
          # Search for ARM64 files instead of assuming paths
          # ==================================================

          echo
          echo "ARM64 native libraries:"
          echo "------------------------------------------"

          ARM64_GTASA=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/arm64-v8a/libGTASA.so' \
            | head -n 1 || true)

          ARM64_OPENAL=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/arm64-v8a/libOpenAL64.so' \
            | head -n 1 || true)

          ARM64_SCAND=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/arm64-v8a/libSCAnd.so' \
            | head -n 1 || true)

          if [ -n "$ARM64_GTASA" ]; then
            echo "OK: $ARM64_GTASA"
          else
            echo "::error::libGTASA.so for ARM64 was not found"
            missing=1
          fi

          if [ -n "$ARM64_OPENAL" ]; then
            echo "OK: $ARM64_OPENAL"
          else
            echo "::error::libOpenAL64.so for ARM64 was not found"
            missing=1
          fi

          if [ -n "$ARM64_SCAND" ]; then
            echo "OK: $ARM64_SCAND"
          else
            echo "::error::libSCAnd.so for ARM64 was not found"
            missing=1
          fi


          # ==================================================
          # Search for ARM32 files
          # ==================================================

          echo
          echo "ARM32 native libraries:"
          echo "------------------------------------------"

          ARM32_GTASA=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/armeabi-v7a/libGTASA.so' \
            | head -n 1 || true)

          ARM32_OPENAL=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/armeabi-v7a/libOpenAL32.so' \
            | head -n 1 || true)

          ARM32_SCAND=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/armeabi-v7a/libSCAnd.so' \
            | head -n 1 || true)

          ARM32_IMM=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/armeabi-v7a/libImmEmulatorJ.so' \
            | head -n 1 || true)

          if [ -n "$ARM32_GTASA" ]; then
            echo "OK: $ARM32_GTASA"
          else
            echo "::error::libGTASA.so for ARM32 was not found"
            missing=1
          fi

          if [ -n "$ARM32_OPENAL" ]; then
            echo "OK: $ARM32_OPENAL"
          else
            echo "::error::libOpenAL32.so for ARM32 was not found"
            missing=1
          fi

          if [ -n "$ARM32_SCAND" ]; then
            echo "OK: $ARM32_SCAND"
          else
            echo "::error::libSCAnd.so for ARM32 was not found"
            missing=1
          fi

          if [ -n "$ARM32_IMM" ]; then
            echo "OK: $ARM32_IMM"
          else
            echo "::warning::libImmEmulatorJ.so for ARM32 was not found"
          fi


          # ==================================================
          # Final verification
          # ==================================================

          echo
          echo "=========================================="

          if [ "$missing" -ne 0 ]; then
            echo "::error::Android project verification failed."
            echo
            echo "Full native library tree:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.so" \
              -print || true

            exit 1
          fi

          echo "Android project verification successful."
          echo "=========================================="


      # ==================================================
      # 9. Setup JDK 17
      # ==================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==================================================
      # 10. Setup Android SDK
      # ==================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "sdk.dir=$ANDROID_HOME" \
            > "$PROJECT_DIR/local.properties"

          echo "Android SDK installed."


      # ==================================================
      # 11. Setup Gradle
      # ==================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==================================================
      # 12. Prepare signing key
      # ==================================================
      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/release.jks"

          if [ -n "$KEYSTORE_BASE64" ]; then

            echo "Using configured signing key."

            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          else

            echo "No signing secrets found."
            echo "Creating temporary signing key."

            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -alias temp \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass tempPass123 \
              -keypass tempPass123 \
              -dname "CN=Dexin Mobile"

            echo "RELEASE_STORE_PASSWORD=tempPass123" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=temp" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=tempPass123" >> "$GITHUB_ENV"

          fi

          echo "RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"


      # ==================================================
      # 13. Build
      # ==================================================
      - name: Build Dexin Mobile APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "=========================================="
          echo "Building Dexin Mobile APK"
          echo "=========================================="

          gradle assembleVer_releaseRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"


      # ==================================================
      # 14. Find APK
      # ==================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Generated APK files"
          echo "=========================================="

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          count=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$count" -eq 0 ]; then
            echo "::error::No APK generated."
            exit 1
          fi

          echo
          echo "APK count: $count"


      # ==================================================
      # 15. Upload APK
      # ==================================================
      - name: Upload Dexin Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Dexin-Mobile-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30


      # ==================================================
      # 16. Upload build log
      # ==================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dexin-Mobile-Build-Log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 30
