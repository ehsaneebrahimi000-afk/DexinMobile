name: Build Dexin Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify uploaded parts
        shell: bash
        run: |
          expected=(
            "part1.zip 23968515 4c3c284ac3fc8c02e3444d383d7ccd72382c70d920eeceb359ef6b684244e223"
            "part2.zip 23961207 6b9552863b454d58b896e728ed16329cb6684ae97a20458eb135a3fd5158c86a"
            "fixed_part3.zip 22685061 edcff0689250f000ba817b5a571708127c16d8a9317dd57d9baa1a737a85cccb"
            "fixed_part4.zip 5869994 db19ac507a0aad7d06a5e925a4e35f86de34012440f064c6f12c5bec22796e7f"
          )
          missing_file=0
          for entry in "${expected[@]}"; do
            read -r name size hash <<< "$entry"
            if [ ! -f "$name" ]; then
              echo "::error::MISSING FILE: $name -> upload it to the repo root"
              missing_file=1
              continue
            fi
            real_size=$(stat -c%s "$name")
            real_hash=$(sha256sum "$name" | cut -d' ' -f1)
            if [ "$real_hash" = "$hash" ]; then
              echo "OK  $name ($real_size bytes)"
            else
              echo "::warning::$name differs from the original (expected $size bytes, repo has $real_size bytes). Continuing - the content check after unpacking decides."
            fi
          done
          ls -la *.zip || true
          exit $missing_file

      - name: Unpack all zip parts and join split files
        shell: bash
        run: |
          set -e
          mkdir -p work
          # extract in order (later parts overwrite earlier files). Old part3.zip/part4.zip are ignored.
          for z in part1.zip part2.zip fixed_part3.zip fixed_part4.zip; do
            echo "unpacking $z"
            unzip -oq "$z" -d work || [ $? -eq 1 ]
          done
          cd work/samp-android-launcher-32-64bit-main
          # join big files that were split into __chunkNNN pieces
          find . -name '*.__chunk000' -print0 | while IFS= read -r -d '' first; do
            base="${first%.__chunk000}"
            echo "joining $base"
            cat "$base".__chunk* > "$base"
            rm -f "$base".__chunk*
          done
          bad=0
          # 1) required files must exist
          for f in app/build.gradle build.gradle settings.gradle app/google-services.json \
                   app/src/main/AndroidManifest.xml \
                   app/src/main/jniLibs/arm64-v8a/libGTASA.so app/src/main/jniLibs/arm64-v8a/libOpenAL64.so app/src/main/jniLibs/arm64-v8a/libSCAnd.so \
                   app/src/main/jniLibs/armeabi-v7a/libGTASA.so app/src/main/jniLibs/armeabi-v7a/libOpenAL32.so app/src/main/jniLibs/armeabi-v7a/libSCAnd.so app/src/main/jniLibs/armeabi-v7a/libImmEmulatorJ.so \
                   app/src/main/cpp/CMakeLists.txt app/src/main/cpp/multiplayer/CMakeLists.txt; do
            if [ ! -s "$f" ]; then echo "::error::missing after unpack: $f"; bad=1; fi
          done
          # 2) total number of files
          count=$(find . -type f | wc -l)
          echo "files after unpack: $count (expected 1969)"
          if [ "$count" -lt 1960 ]; then echo "::error::too few files ($count) - some part is old or incomplete"; bad=1; fi
          # 3) latest edits must be present (detects old part files)
          grep -q "Legendary Samp" app/src/main/java/com/glory/Config.java || { echo "::error::Config.java is an old version (no Legendary Samp)"; bad=1; }
          grep -q "UntagPtr" app/src/main/cpp/multiplayer/game/hooks.cpp || { echo "::error::hooks.cpp is an old version (no UntagPtr)"; bad=1; }
          grep -q "playertablist.h" app/src/main/cpp/multiplayer/gui/gui.h || { echo "::error::gui.h is an old version (include case fix missing)"; bad=1; }
          grep -q "Mobile/MobileMenu/MobileMenu.h" app/src/main/cpp/multiplayer/gui/gui.cpp || { echo "::error::gui.cpp is an old version"; bad=1; }
          if [ "$bad" -ne 0 ]; then echo "Project is incomplete or old. Upload fixed_part3.zip and fixed_part4.zip again."; exit 1; fi
          echo "Project unpacked OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (NDK, CMake)
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > work/samp-android-launcher-32-64bit-main/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found - generating a temporary key."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias temp -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass tempPass123 -keypass tempPass123 -dname "CN=Dexin Mobile"
            echo "RELEASE_STORE_PASSWORD=tempPass123" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=temp" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=tempPass123" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        working-directory: work/samp-android-launcher-32-64bit-main
        run: |
          gradle assembleVer_releaseRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dexin-Mobile-APK
          path: work/samp-android-launcher-32-64bit-main/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore_releaseRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"


      # ==================================================
      # 14. Find APK
      # ==================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Generated APK files"
          echo "=========================================="

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          count=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$count" -eq 0 ]; then
            echo "::error::No APK generated."
            exit 1
          fi

          echo
          echo "APK count: $count"


      # ==================================================
      # 15. Upload APK
      # ==================================================
      - name: Upload Dexin Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Dexin-Mobile-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30


      # ==================================================
      # 16. Upload build log
      # ==================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dexin-Mobile-Build-Log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 30
