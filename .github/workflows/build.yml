name: Build Dexin Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack all zip parts and join split files
        shell: bash
        run: |
          set -e
          ls -la part*.zip
          mkdir -p work
          for z in part*.zip; do
            echo "unpacking $z"
            unzip -oq "$z" -d work
          done
          cd work/samp-android-launcher-32-64bit-main
          # join big files that were split into __chunkNNN pieces
          find . -name '*.__chunk000' -print0 | while IFS= read -r -d '' first; do
            base="${first%.__chunk000}"
            echo "joining $base"
            cat "$base".__chunk* > "$base"
            rm -f "$base".__chunk*
          done
          if [ -f ../../manifest.sha256 ]; then
            sha256sum -c ../../manifest.sha256 --quiet
            echo "All files verified."
          else
            echo "manifest.sha256 not found, skipping check"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found - generating a temporary key."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias temp -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass tempPass123 -keypass tempPass123 -dname "CN=Dexin Mobile"
            echo "RELEASE_STORE_PASSWORD=tempPass123" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=temp" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=tempPass123" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: work/samp-android-launcher-32-64bit-main
        run: gradle assembleVer_releaseRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dexin-Mobile-APK
          path: work/samp-android-launcher-32-64bit-main/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
